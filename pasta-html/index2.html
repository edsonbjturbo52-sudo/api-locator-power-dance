<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Dance 2026</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Garante zero barras de rolagem */
            background-color: transparent;
        }

        #fd {
            height: 160px; 
            width: 100%; 
            max-width: 995px;
            position: relative; 
            display: flex; 
            align-items: center;
            overflow: hidden; 
            border-bottom: 2px solid #ffcc0000;
        }

        .scrolling-text {
            display: flex;
            align-items: center;
            white-space: nowrap;
            position: absolute;
            animation: scroll 18s linear infinite;
            color: white;
            text-shadow: 1px 5px 5px #e40707;
        }

        /* Reseta a margem padrão do h1 para não estourar a altura */
        .scrolling-text h1 {
            margin: 0;
            font-size: 40px;
            display: flex;
            align-items: center;
        }

        .mrq {
            width: 100px;
            height: 100px;
            margin: 0 20px;
            vertical-align: middle; /* Centraliza a imagem com o texto */
        }

        @keyframes scroll {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(-100%);
            }
        }
    </style>
</head>

<body>
    <div id="fd">
        <div class="scrolling-text">
            <h1>
                POWER&nbsp; DANCE&nbsp; 2026&nbsp;&nbsp;
                <img class="mrq" src="../image/log-rotate.gif" alt="Logo Rotativo">&nbsp;&nbsp;
                <span id="texto-dinamico">LIGADO DE: LOCALIZANDO...</span>&nbsp;&nbsp;
                <img class="mrq" src="../image/log-rotate.gif" alt="Logo Rotativo">&nbsp;&nbsp;
                DJ&nbsp; ROBERT&nbsp; BJ&nbsp; NO&nbsp; COMANDO&nbsp; DA&nbsp; EMOÇÃO!!
            </h1>
        </div>
    </div>

    <script>
        async function buscarLocalizacao() {
            const elementoLocal = document.getElementById('texto-dinamico');
            
            try {
                // URL da sua API no Render
                const resposta = await fetch('https://api-locator-power-dance.onrender.com/api/localizacao');
                const dados = await resposta.json();

                if (dados.cidade && dados.uf) {
                    const cidade = dados.cidade.toUpperCase();
                    const uf = dados.uf.toUpperCase();
                    
                    elementoLocal.innerText = `OUVINDO DE: ${cidade} - ${uf}`;
                } else {
                    elementoLocal.innerText = `LIGADO NA MELHOR PROGRAMAÇÃO`;
                }
            } catch (erro) {
                console.error('Erro ao buscar localização:', erro);
                elementoLocal.innerText = `LIGADO NA MELHOR PROGRAMAÇÃO`;
            }
        }

        window.addEventListener('DOMContentLoaded', buscarLocalizacao);
    </script>
</body>


</html>
