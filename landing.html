<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar no Chat - Power Dance</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #17083d, #0e0b48);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1.main-title {
            color: goldenrod;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        h2.sub-title {
            color: azure;
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: normal;
        }

        .login-box {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }

        .login-box button {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: Arial, sans-serif;
            color: white;
            background-color: #db4437;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .login-box button:hover {
            background-color: #c1351d;
        }

        #popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0a0a0c;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 1000;
            width: 90%;
            max-width: 380px;
        }

        #popup h2 {
            margin-bottom: 20px;
            color: #005bea;
            font-size: 1.3rem;
        }

        .popup-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        #popup button {
            flex: 1;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #adminBtn {
            background-color: #4caf50;
            color: white;
        }

        #muralBtn {
            background-color: #2196f3;
            color: white;
        }
    </style>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registrado com sucesso!', reg))
                    .catch(err => console.error('Falha ao registrar o Service Worker:', err));
            });
        }
    </script>
</head>

<body>
    <h1 class="main-title">Bem-vindo ao Chat</h1>
    <h2 class="sub-title">Entrar com sua conta</h2>

    <div class="login-box">
        <button id="loginBtn">Google</button>
    </div>

    <div id="popup">
        <h2>Escolha onde deseja entrar</h2>
        <div class="popup-buttons">
            <button id="adminBtn">Admin</button>
            <button id="muralBtn">Mural</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"; 
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"; 
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js"; 

        const firebaseConfig = { 
            apiKey: "AIzaSyDDMNEQL0Cj6eXtAISqtBpYiYbkEOoLkqM", 
            authDomain: "recados-fca7e.firebaseapp.com", 
            projectId: "recados-fca7e", 
            databaseURL: "https://recados-fca7e-default-rtdb.firebaseio.com",
            storageBucket: "recados-fca7e.appspot.com", 
            messagingSenderId: "637659136101", 
            appId: "1:637659136101:web:ac2db24f4c9eef2efe068c" 
        }; 

        const app = initializeApp(firebaseConfig); 
        const auth = getAuth(app); 
        const provider = new GoogleAuthProvider();
        const database = getDatabase(app); 

        // Expõe globalmente para suporte a scripts externos
        window.auth = auth;
        window.database = database;

        // Evento de Login
        document.getElementById('loginBtn').addEventListener('click', async () => { 
            try { 
                const result = await signInWithPopup(auth, provider); 
                const user = result.user; 
                
                // Verifica se o UID está na nó /admins do Realtime Database
                const adminRef = ref(database, 'admins/' + user.uid); 
                const snapshot = await get(adminRef); 
                
                if (snapshot.exists()) { 
                    // Se for Admin: mostra o popup de seleção
                    document.getElementById('popup').style.display = 'block'; 
                } else { 
                    // Usuário comum: redireciona direto para o mural
                    window.location.href = "mm.html"; 
                } 
            } catch (error) { 
                alert("Erro ao fazer login: " + error.message); 
            } 
        }); 

        // Ações dos botões do modal
        document.getElementById('adminBtn').addEventListener('click', () => { 
            window.location.href = "admin_m.html"; 
        }); 

        document.getElementById('muralBtn').addEventListener('click', () => { 
            window.location.href = "mm.html"; 
        });
    </script>

    <script>
        // Bloqueia clique direito e tecla F12
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) { 
                e.preventDefault();
                return false; 
            }
        });
    </script>
</body>

</html>
