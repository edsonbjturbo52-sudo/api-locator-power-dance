<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat de Recados & Bot - Power Dance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 94vh;
      background-color: rgba(0, 0, 0, 0);
    }
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 15px;
      background-color: rgba(15, 15, 118, 0.188);
    }
    .messagesContainer {
      flex: 1;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column-reverse;
    }
    .message {
      border: 1px solid rgba(253, 253, 253, 0);
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      color: rgba(240, 248, 255, 0.85);
      background-color: rgba(0, 0, 0, 0.2);
      position: relative;
      animation: marqueeUp 60s linear infinite;
      opacity: 0;
      display: none;
    }
    .message.active {
      display: block;
      opacity: 1;
    }
    .message img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 10px;
      object-fit: cover;
    }
    .message .content {
      margin-left: 150px;
      font-size: 32px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .message .name {
      font-weight: bold;
      color: #007BFF;
      margin: 0 0 5px 0;
    }
    .message .email {
      color: #d4d117;
      font-size: 24px;
      margin: 0 0 5px 0;
    }
    .message .timestamp {
      font-size: 0.6em;
      color: #aaa;
      margin-top: 5px;
    }
    .footer {
      display: flex;
      align-items: center;
      padding: 10px;
      background-color: rgb(161, 155, 155);
      border-top: 1px solid #a9dae2;
      position: relative;
    }
    .input-row {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 8px;
    }
    .emoji-trigger-btn {
      background: none;
      border: none;
      font-size: 36px;
      cursor: pointer;
      padding: 5px;
      line-height: 1;
      transition: transform 0.2s;
    }
    .emoji-trigger-btn:hover {
      transform: scale(1.15);
    }
    .footer textarea {
      flex: 1;
      height: 70px;
      padding: 10px;
      border: 3px solid #d80808;
      border-radius: 5px;
      font-size: 28px;
      font-family: Impact, sans-serif;
      resize: none;
    }
    .footer button.send-btn {
      padding: 16px 20px;
      border: none;
      border-radius: 5px;
      background-color: #007BFF;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }
    .footer button.send-btn:disabled {
      background-color: #666;
      cursor: not-allowed;
    }

    /* MODAL DE EMOJIS ESTILO WHATSAPP */
    .emoji-picker-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(5px);
      z-index: 9999;
      flex-direction: column;
      justify-content: flex-end;
    }
    .emoji-picker-modal.active {
      display: flex;
    }
    .emoji-picker-content {
      background: rgba(18, 28, 36, 0.92);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      height: 70vh;
      display: flex;
      flex-direction: column;
      border-top: 2px solid #00a884;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
    }
    .emoji-picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(11, 20, 26, 0.95);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .emoji-picker-header h3 {
      margin: 0;
      color: #e9edef;
      font-size: 20px;
    }
    .close-emoji-btn {
      background: none;
      border: none;
      color: #8696a0;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .emoji-tabs {
      display: flex;
      overflow-x: auto;
      background: rgba(11, 20, 26, 0.8);
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      gap: 15px;
    }
    .emoji-tab-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .emoji-tab-btn.active {
      opacity: 1;
      border-bottom: 2px solid #00a884;
    }
    .emoji-grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
      gap: 12px;
    }
    .emoji-item {
      font-size: 32px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s;
    }
    .emoji-item:hover {
      transform: scale(1.3);
    }
    .notification {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #007BFF;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      z-index: 10;
      font-size: 18px;
      font-weight: bold;
    }
    @keyframes marqueeUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-980%); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="messagesContainer" id="messagesContainer"></div>
  </div>
  
  <div class="footer">
    <div class="input-row">
      <button type="button" class="emoji-trigger-btn" id="openEmojiModal" title="Escolher Emoji">😀</button>
      <textarea id="messageInput" placeholder="Ex: !Double You - Please Don't Go" maxlength="150" disabled></textarea>
      <button id="submitMessage" class="send-btn" disabled>Enviar</button>
    </div>
  </div>

  <!-- POP-UP DE EMOJIS COMPLETO ESTILO WHATSAPP -->
  <div class="emoji-picker-modal" id="emojiModal">
    <div class="emoji-picker-content">
      <div class="emoji-picker-header">
        <h3>Selecione um Emoji</h3>
        <button type="button" class="close-emoji-btn" id="closeEmojiModal">&times;</button>
      </div>
      <div class="emoji-tabs" id="emojiTabs"></div>
      <div class="emoji-grid-container" id="emojiGrid"></div>
    </div>
  </div>

  <div id="notificationContainer"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getDatabase, ref, push, onChildAdded, query, limitToLast, get, remove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDMNEQL0Cj6eXtAISqtBpYiYbkEOoLkqM",
      authDomain: "recados-fca7e.firebaseapp.com",
      databaseURL: "https://recados-fca7e-default-rtdb.firebaseio.com",
      projectId: "recados-fca7e",
      storageBucket: "recados-fca7e.appspot.com",
      messagingSenderId: "637659136101",
      appId: "1:637659136101:web:ac2db24f4c9eef2efe068c",
      measurementId: "G-ZE733KFTMF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const bannedWords = [
      "seu negro", "mito", "MITO", "prostituta", "viado", "boiola", "bolsonaro", "ladrao", "talarico", "ruim", "pessimo", "péssimo", "paia", "bosta", "rola", "pica", "lixo", "zona", "sertanejo", "forró", "axé", "pagode", "baile", "funk", "foda", "buceta", "piroca", "jeba", "bonde", "roubo", "roubar", "assaltar", "estrupar", "estrupador", "traficante", "petista", "safado", "invasor", "traveco", "piranha", "biscate", "satanas", "diabo", "ateo", "atoa", "vagal", "cú", "cu", "bunda", "rabo", "rabão", "boasuda", "pix", "92", "93", "9", "67", "22", "refrigeração", "ar", "serviços", "mao", "mão", "pé", "salão", "mecanica",
      "oficina", "3", "negro", "piscina", "cade", "cade?", "deve", "paga", "ladrão", "lula", "Lula",
      "vadia", "janja", "jamja", "egoista", "cac", "nikolas", "esquerda", "direita", "mecânica", "bucetuda","gozar", "bosta", "merda", "cocô", "cagada", "cagado", "cagadao", "arrombado", "mercado", "chiqueiro", "http://", "https://","siga", "sigam", "sigam-me"
    ];

    const emojiCategories = {
      "😀": ["😀","😃","😄","😁","😆","😅","😂","🤣","🥲","☺️","😊","😇","🙂","🙃","😉","😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🥸","🤩","🥳","😏","😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫","😩","🥺","😢","😭","😤","😠","😡","🤬","🤯","😳","🥵","🥶","😱","😨","😰","😥","😓","🤗","🤔","🤭","🤫","🤥","😶","😐","😑","😬","🙄","😯","😦","😧","😮","😲","🥱","😴","🤤","😪","😵","🤐","🥴","🤢","🤮","🤧","😷","🤒","🤕"],
      "👋": ["👋","🤚","🖐️","✋","🖖","👌","🤌","🤏","✌️","🤞","🤟","🤘","🤙","👈","👉","👆","🖕","👇","☝️","👍","👎","✊","👊","🤛","🤜","👏","🙌","👐","🤲","🤝","🙏","✍️","💅","🤳","💪","🦾","🦵","🦿","🦶","👂","🦻","👃","🧠","🫀","🫁","🦷","🦴","👀","👁️","👅","👄"],
      "❤️": ["❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❣️","💕","💞","💓","💗","💖","💘","💝","💟","☮️","✝️","☪️","🕉️","☸️","✡️","🔯","🕎","☯️","☦️","🛐","⛎","♈️","♉️","♊️","♋️","♌️","♍️","♎️","♏️","🏹","♑️","♒️","♓️","🆔","⚛️"],
      "🚗": ["🚗","🚕","🚙","🚌","🏣","🛻","🚚","🚛","🚜","🏎️","🏎","🏍️","🛵","🛺","🚲","🛴","🚏","🛣️","🛤️","🛢️","⛽","🚨","🚥","🚦","🛑","🚧","⚓","⛵","canoe","🚤","🛳️","⚙️","🚁","🛸","🚀","🛰️","💺"],
      "🏠": ["🏠","🏡","🏫","🏢","🏣","🏥","🏦","🏨","🏪","🏫","🏬","🏭","🏰","🏯","💒","🗼","🗽","⛪","🕌","🛕","🕍","⛩️","🕋","⛲","⛺","🌁","🌃","🏙️","🌄","🌅","🌆","🌇","🌉","♨️"],
      "🛏️": ["🛏️","🛋️","🚿","🛁","toilet","🔑","🗝️","🚪","🪑","💡","🔦","🏮","🧱","🗿","🧳","⌛","⏳","⌚","⏰","🎈","🎉","🎊","🎋","🎍","🎎","🎏","🎐","🎑","🎟️","🎫","🎖️","🏆","🏅","🥇","🥈","🥉","⚽","🏀","🏈","⚾","🥎","tennis","🏐","rugby","🥏","🎱","🪀","pingpong","badminton","hockey","fieldhockey","lacrosse","cricket","boomerang","goal","golf","kite","bow","fishing","scuba","boxing","martialarts","running","skate","roller","sled","iceSkate","curling","ski","snowboard"],
      "🎵": ["🎵","🎶","🎼","🎹","🥁","🎷","🎺","🎸","🪕","violin","🎲","darts","bowling","game","slot","puzzle","headphones","mic","studio","radio","tv","camera","flash","video","tape","search","search2","candle","light","torch"]
    };

    let messages = [];
    let currentIndex = 0;

    function sanitizarTexto(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
        .replace(/javascript:/gi, "")
        .replace(/onload/gi, "")
        .replace(/onerror/gi, "");
    }

    const emojiModal = document.getElementById('emojiModal');
    const openEmojiModal = document.getElementById('openEmojiModal');
    const closeEmojiModal = document.getElementById('closeEmojiModal');
    const emojiTabs = document.getElementById('emojiTabs');
    const emojiGrid = document.getElementById('emojiGrid');
    const messageInput = document.getElementById('messageInput');

    Object.keys(emojiCategories).forEach((catIcon, index) => {
      const tabBtn = document.createElement('button');
      tabBtn.type = 'button';
      tabBtn.className = `emoji-tab-btn ${index === 0 ? 'active' : ''}`;
      tabBtn.textContent = catIcon;
      tabBtn.addEventListener('click', () => {
        document.querySelectorAll('.emoji-tab-btn').forEach(b => b.classList.remove('active'));
        tabBtn.classList.add('active');
        carregarEmojisCategoria(catIcon);
      });
      emojiTabs.appendChild(tabBtn);
    });

    function carregarEmojisCategoria(catIcon) {
      emojiGrid.innerHTML = '';
      emojiCategories[catIcon].forEach(emoji => {
        const item = document.createElement('span');
        item.className = 'emoji-item';
        item.textContent = emoji;
        item.addEventListener('click', () => {
          if (!messageInput.disabled) {
            messageInput.value += emoji;
            messageInput.focus();
          }
        });
        emojiGrid.appendChild(item);
      });
    }

    carregarEmojisCategoria("😀");

    openEmojiModal.addEventListener('click', () => {
      emojiModal.classList.add('active');
    });

    closeEmojiModal.addEventListener('click', () => {
      emojiModal.classList.remove('active');
    });

    emojiModal.addEventListener('click', (e) => {
      if (e.target === emojiModal) {
        emojiModal.classList.remove('active');
      }
    });

    onAuthStateChanged(auth, user => {
      const btn = document.getElementById('submitMessage');
      messageInput.disabled = !user;
      btn.disabled = !user;
      if (user) {
        showNotification(`${user.displayName} está online`);
      }
    });

    document.getElementById('submitMessage').addEventListener('click', async () => {
      let text = messageInput.value.trim();
      const user = auth.currentUser;

      if (!text) {
        alert("Por favor, insira um recado ou pedido.");
        return;
      }

      if (!user) return;

      text = sanitizarTexto(text);

      const words = text.toLowerCase().split(/\s+/);
      if (words.some(word => bannedWords.includes(word))) {
        alert("PALAVRA PROIBIDA! Comentários ofensivos, políticos ou comerciais são proibidos.");
        return;
      }

      // Publica no nó 'messages' para o bot processar automaticamente
      const message = {
        name: sanitizarTexto(user.displayName),
        email: user.email,
        photoURL: user.photoURL || "https://via.placeholder.com/150",
        message: text,
        timestamp: new Date().toISOString()
      };

      push(ref(database, 'messages'), message)
        .then(() => {
          messageInput.value = "";
          messageInput.blur();
          emojiModal.classList.remove('active');
        })
        .catch(console.error);
    });

    const messagesContainer = document.getElementById('messagesContainer');
    const messagesRef = ref(database, 'messages');

    onChildAdded(messagesRef, async (snapshot) => {
      const msg = snapshot.val();
      messages.push(msg);

      if (messages.length === 1) {
        displayMessage(0);
      }

      const q = query(messagesRef, limitToLast(10));
      const snapshotLast10 = await get(q);
      if (snapshotLast10.exists()) {
        const validKeys = new Set(Object.keys(snapshotLast10.val()));
        const allSnapshot = await get(messagesRef);
        if (allSnapshot.exists()) {
          Object.entries(allSnapshot.val()).forEach(([key]) => {
            if (!validKeys.has(key)) {
              remove(ref(database, `messages/${key}`));
            }
          });
        }
      }
    });

    function displayMessage(index) {
      if (!messages[index]) return;
      
      const msg = messages[index];
      const el = document.createElement('div');
      el.className = 'message active';
      el.innerHTML = `
        <img src="${msg.photoURL}" alt="${msg.name}">
        <div class="content">
          <p class="name">${msg.name}</p>
          <p class="email">${msg.email}</p>
          <p>${msg.message}</p>
          <p class="timestamp"><small>${new Date(msg.timestamp).toLocaleTimeString()}</small></p>
        </div>`;
      
      messagesContainer.appendChild(el);

      setTimeout(() => {
        el.classList.remove('active');
        setTimeout(() => {
          if (messagesContainer.contains(el)) {
            messagesContainer.removeChild(el);
          }
          currentIndex = (currentIndex + 1) % messages.length;
          if (messages.length > 1) {
            displayMessage(currentIndex);
          }
        }, 990);
      }, 15000);
    }

    function showNotification(text) {
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = text;
      document.getElementById('notificationContainer').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }
  </script>

  <script>
    const msgInput = document.getElementById('messageInput');

    msgInput.addEventListener('paste', function(e) {
      e.preventDefault();
      alert("Por segurança da Rádio, colar textos externos é proibido. Digite sua mensagem manualmente!");
      return false;
    });

    msgInput.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')) {
        e.preventDefault();
        alert("Atalho de colar desativado por motivos de segurança.");
        return false;
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
      }
    });
  </script>
</body>
</html>
