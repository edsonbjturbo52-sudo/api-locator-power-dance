<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; background-color: transparent !important; overflow: hidden; }
        #fd {
            height: 160px; width: 100%; max-width: 995px;
            position: relative; display: flex; align-items: center;
            overflow: hidden; border-bottom: 2px solid #ffcc00;
        }
        .scrolling-text {
            white-space: nowrap; position: absolute;
            animation: scroll 18s linear infinite; 
            font-size: 46px; color: #ffffff;
            font-family: 'Arial', sans-serif; font-weight: bold;
            text-shadow: 0 0 8px #06e92b, 0 0 15px #06e92b;
        }
        @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>
    <div id="fd">
        <div id="display-text" class="scrolling-text">
            POWER DANCE NO AR  SEMPRE  COM VOCÊ, A FESTA NÃO PARA! - POWER DANCE SEMPRE CONECTADO   COM VOCÊ,  NA BATIDADO FLASH BACK , PORQUE AQUI A FESTA NÃO PARA!
        </div>
    </div>

    <script>
        // Escuta a mensagem enviada pelo script pai (o app principal)
        window.addEventListener('message', (event) => {
            if (event.data && event.data.bairro) {
                const display = document.getElementById('display-text');
                // Exibe o bairro filtrado
                display.innerText = "LOCALIZAÇÃO: " + event.data.bairro.toUpperCase();
            }
        });
    </script>
</body>
</html>
